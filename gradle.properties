# ============================================================
# gradle.properties — Trade Tools
# ============================================================

# Mémoire JVM allouée au build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ⚠️ OBLIGATOIRE pour utiliser les bibliothèques AndroidX (appcompat, webkit…)
android.useAndroidX=true

# Génère uniquement la R.class du module (build plus rapide, moins de conflits)
android.nonTransitiveRClass=true
