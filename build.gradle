// ============================================================
// build.gradle — Trade Tools (racine)
// ============================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

// ⚠️ Ce bloc est OBLIGATOIRE pour résoudre les dépendances
// comme androidx.appcompat:appcompat (sinon erreur "no repositories are defined")
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.monentreprise.tradertools'
    compileSdk 34

    defaultConfig {
        applicationId "com.monentreprise.tradertools"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
            res.srcDirs = ['src/main/res']
        }
    }

    // Empêche la compression des assets lus par la WebView
    androidResources {
        noCompress 'html', 'js', 'css'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
