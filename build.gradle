// ============================================================
// build.gradle — Trade Tools (racine)
// ============================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Correction du conflit Kotlin (classes dupliquées jdk7/jdk8)
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.monentreprise.tradertools'
    compileSdk 34

    defaultConfig {
        applicationId "com.monentreprise.tradertools"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    // Signature STABLE : chaque build porte la même signature, donc une nouvelle version
    // s'installe par-dessus l'ancienne sans désinstaller (et sans perdre le journal de trades).
    // Si le fichier trade-tools.keystore est absent, Android utilise sa clé de debug habituelle.
    signingConfigs {
        debug {
            def cle = file('trade-tools.keystore')
            if (cle.exists()) {
                storeFile cle
                storePassword 'f8e91b61e46bddd64d'
                keyAlias 'tradetools'
                keyPassword 'f8e91b61e46bddd64d'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
            res.srcDirs = ['src/main/res']
        }
    }

    // Empêche la compression des assets lus par la WebView
    androidResources {
        noCompress 'html', 'js', 'css'
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.8.2'
}
