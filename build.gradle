// ============================================================
// build.gradle — Trade Tools (racine)
// ============================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

// ⚠️ OBLIGATOIRE : résolution des dépendances (appcompat, webkit…)
allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // ✅ Correction du conflit Kotlin (classes dupliquées jdk7/jdk8)
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.monentreprise.tradertools'
    compileSdk 34

    defaultConfig {
        applicationId "com.monentreprise.tradertools"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
            res.srcDirs = ['src/main/res']
        }
    }

    // Empêche la compression des assets lus par la WebView
    androidResources {
        noCompress 'html', 'js', 'css'
    }

    // ✅ Ignore les métadonnées AAR inutiles (évite des warnings sur les libs obsolètes)
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
