name: Build APK - Trade Tools

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Vérification des fichiers du projet
        run: |
          echo "=== Arborescence du dépôt ==="
          find . -path ./.git -prune -o -type f -print | sort | head -80
          erreurs=0
          for f in index.html AndroidManifest.xml build.gradle gradle.properties \
                   src/main/java/com/monentreprise/tradertools/MainActivity.java; do
            if [ ! -f "$f" ]; then
              echo "::error::Fichier manquant ou mal placé : $f"
              erreurs=1
            fi
          done
          if ! grep -rq "Theme.TradeTools" src/main/res/values 2>/dev/null; then
            echo "::error::Le thème Theme.TradeTools est introuvable dans src/main/res/values/ (themes.xml)"
            erreurs=1
          fi
          [ "$erreurs" = 0 ] || exit 1
          echo "Tous les fichiers requis sont présents."

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3b. Préparation de la clé de signature
        run: |
          # La clé est fournie en texte (cle-signature.txt ou trade-tools.keystore.b64) : un fichier binaire s'abîme facilement à l'envoi.
          for f in cle-signature.txt trade-tools.keystore.b64; do
            if [ -e "$f" ]; then
              if [ -s "$f" ] && base64 -d "$f" > /tmp/cle.bin 2>/dev/null && [ -s /tmp/cle.bin ]; then
                cp /tmp/cle.bin trade-tools.keystore
                echo "Clé reconstruite depuis $f"
                break
              else
                echo "::warning::Le fichier $f est vide ou incomplet : il est ignoré."
              fi
            fi
          done
          if [ -f trade-tools.keystore ]; then
            MDP=$(sed -n "s/.*storePassword '\([^']*\)'.*/\1/p" build.gradle | head -1)
            if keytool -list -keystore trade-tools.keystore -storepass "$MDP" -alias tradetools >/dev/null 2>&1; then
              echo "Clé de signature valide : signature stable activée."
            else
              echo "::warning::trade-tools.keystore est illisible (fichier abîmé à l'envoi ?). Signature par défaut utilisée : désinstallez l'ancienne version avant chaque installation."
              rm -f trade-tools.keystore
            fi
          else
            echo "Aucune clé fournie : signature par défaut."
          fi

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 5. Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Préparation de l'arborescence
        run: |
          mkdir -p src/main/assets
          cp index.html src/main/assets/index.html

      - name: 7. Compilation de l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 8. Contrôle du contenu de l'APK
        run: |
          APK=$(ls build/outputs/apk/debug/*.apk | head -1)
          echo "APK : $APK"
          unzip -l "$APK" | grep -q "assets/index.html" || { echo "::error::index.html est absent de l'APK"; exit 1; }
          unzip -p "$APK" 'classes*.dex' | grep -aq "com/monentreprise/tradertools/MainActivity" || {
            echo "::error::La classe MainActivity est absente de l'APK : MainActivity.java n'a pas été compilé (vérifiez son dossier : src/main/java/com/monentreprise/tradertools/)"
            exit 1
          }
          echo "APK conforme : page d'accueil et MainActivity présentes."
          mkdir -p sortie
          cp "$APK" sortie/Trade-Tools.apk

      - name: 9. Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Tools-APK
          path: sortie/Trade-Tools.apk
          retention-days: 30
          if-no-files-found: error
